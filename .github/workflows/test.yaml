name: Test

on:
  pull_request:
    branches:
      - devel

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

run-name: >-
  Test PR #${{ github.event.pull_request.number }}
  [${{ github.ref_name }} @ ${{ github.sha }}]

jobs:
  lint:
    name: Unittests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      
      - name: Run unit tests
        run: |
          python -m pytest
