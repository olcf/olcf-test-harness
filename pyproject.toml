[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olcf-test-harness"
dynamic = ["version"]
description = "Oak Ridge Computing Facility's HPC test harness."
requires-python = ">=3.6"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-PyYAML",
    "types-python-dateutil",
    "types-requests"
]
docs = [
    "sphinx",
    "sphinx-design",
    "sphinx-rtd-theme",
    "sphinx-multiversion"
]
ext = [
    "PyYAML",
    "Jinja2",
    "python-dateutil",
    "requests"
]

[project.scripts]
othctl = "oth.cli.othctl:main"

[tool.hatch.build.targets.wheel]
packages = ["oth"]

[tool.hatch.version]
path = "oth/__init__.py"

[tool.ruff]
target-version = "py37"
include = [
    "tests/*",
    "oth/cli/*",
    "oth/config.py",
    "oth/libraries/output_hub/*",
    "oth/libraries/repositories/*",
    "oth/libraries/oth_database_loggers/*",
    "oth/libraries/input_files.py",
    "oth/libraries/rgt_test.py",
    "oth/schedulers/*"
]

[tool.ruff.lint]
ignore = [
    "FA100"
]
extend-select = [
    "DTZ"
]

[tool.mypy]
files = [
    "tests",
    "oth/cli",
    "oth/libraries/output_hub",
    "oth/libraries/repositories",
    "oth/libraries/oth_database_loggers",
    "oth/schedulers"
]
ignore_missing_imports = true

[tool.pytest_env]
OTHCTL_MACHINE = "minimal_machine"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
