[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olcf-test-harness"
version = "4.0.0.dev0"
description = "Oak Ridge Computing Facility's HPC test harness."
requires-python = ">=3.6"
dependencies = []

[project.optional-dependencies]
ext = [
    "pyyaml",
    "jinja2"
]
dev = [
    "ruff"
]

[tool.ruff]
target-version = "py37"
include = [
    "harness/libraries/output_hub*",
    "harness/schedulers/*"
]

[tool.ruff.lint]
ignore = [
    "FA100"
]
