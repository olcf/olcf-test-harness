[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olcf-test-harness"
dynamic = ["version"]
description = "Oak Ridge Computing Facility's HPC test harness."
requires-python = ">=3.6"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff"
]
docs = [
    "sphinx",
    "sphinx-design",
    "sphinx-rtd-theme"
]
ext = [
    "pyyaml",
    "jinja2",
    "python-dateutil"
]

[project.scripts]
othctl = "oth.cli.othctl:main"

[tool.hatch.build.targets.wheel]
packages = ["oth"]

[tool.hatch.version]
path = "oth/__init__.py"

[tool.ruff]
target-version = "py37"
include = [
    "tests/*",
    "oth/cli/*",
    "oth/libraries/output_hub/*",
    "oth/libraries/repositories/*",
    "oth/schedulers/*"
]

[tool.ruff.lint]
ignore = [
    "FA100"
]

[tool.mypy]
files = [
    "tests",
    "oth/cli",
    "oth/libraries/output_hub",
    "oth/libraries/repositories",
    "oth/schedulers"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
